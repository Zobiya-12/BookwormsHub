<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Anti-flicker theme script: runs before the CSS loads -->
  <script>
    (function () {
      const saved = localStorage.getItem('bw_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    })();
  </script>

  <link rel="stylesheet" href="../css/styles.css">
  <style>
/* Sign-up page extras: flip-able pass, confetti, welcome overlay.
   Plain CSS, uses the same variables as styles.css. */

.pass-side { display: grid; gap: 1rem; justify-items: center; position: sticky; top: 5.5rem; }
.pass-side .flip { width: 100%; }

/* Both faces share one grid cell, so they are always the same size */
.flip { perspective: 1200px; }
.flip-in {
  display: grid;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.3, 1.3, .5, 1);
}
.flip.flipped .flip-in { transform: rotateY(180deg); }
.flip-face {
  grid-area: 1 / 1;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.flip-back { transform: rotateY(180deg); }
.flip-face > .pass { height: 100%; align-content: start; }

/* Back of the pass */
.pass-quote { font: italic 400 1.05rem/1.5 var(--serif); align-self: center; }
.pass-quote cite { display: block; margin-top: .6rem; font: 400 .78rem var(--sans); opacity: .7; font-style: normal; }
.pass-back-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; background: #0006; padding: .8rem; border-radius: 10px; font-size: .85rem; }
.pass-back-grid b { color: #e0a84f; }

/* Floating particles sit behind everything */
#particles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.sign-grid { position: relative; z-index: 1; }

/* Confetti covers the screen but ignores clicks */
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }

/* Welcome overlay sits under the confetti */
.welcome { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; padding: 1rem; background: #000a; backdrop-filter: blur(3px); }
.welcome[hidden] { display: none; }
.welcome-card { background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 2rem; width: min(440px, 100%); text-align: center; display: grid; gap: 1rem; justify-items: center; }
.welcome-card h2 { font: 900 1.7rem var(--serif); }
.welcome-card p { color: var(--mute); }

@media (max-width: 820px) { .pass-side { position: static; } }
@media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } }
  </style>
  <title>Get your reader pass — BookWorm's Hub</title>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div id="siteNav"></div>

  <main class="sign-grid">
    <form class="panel" id="form" autocomplete="on">
      <div>
        <h1>Get your reader pass</h1>
        <p class="sec-sub">Free, and saved only in this browser. Takes under a minute.</p>
      </div>

      <div class="two">
        <label class="field">Name
          <input class="sub-input" id="name" type="text" required maxlength="40" autocomplete="name">
        </label>
        <label class="field">Email
          <input class="sub-input" id="email" type="email" required maxlength="80" autocomplete="email">
        </label>
      </div>

      <label class="field">Your motto <small class="sec-sub">(shown on the back of your pass)</small>
        <input class="sub-input" id="motto" type="text" maxlength="60" placeholder="Words are my sanctuary and my sword.">
      </label>

      <div>
        <h2>Pick a companion</h2>
        <div class="avatars" id="avatars"></div>
      </div>

      <div>
        <h2>Favourite genres <small id="gc"></small></h2>
        <div class="finder-row" id="pills"></div>
        <p class="sec-sub" id="gMore" style="margin:.9rem 0 .5rem">Loading more genres from Open Library…</p>
        <div class="finder-row" id="pills2"></div>
      </div>

      <div>
        <h2>Yearly goal: <span id="goalV">25</span> books</h2>
        <input type="range" id="goal" min="5" max="100" step="5" value="25" aria-label="Books per year">
        <p class="sec-sub" id="tierT"></p>
      </div>

      <button class="btn-primary" type="submit">Create my pass</button>
      <a class="auth-back" id="later" href="../index.html">Maybe later</a>
    </form>

    <aside class="pass-side">
      <div class="flip" id="flip">
        <div class="flip-in">
          <div class="flip-face" id="passFront"></div>
          <div class="flip-face flip-back" id="passBack"></div>
        </div>
      </div>
      <button type="button" class="btn-ghost" id="flipBtn" aria-pressed="false">Flip the pass</button>
    </aside>
  </main>

  <!-- Shown after sign-up -->
  <div class="welcome" id="welcome" hidden>
    <div class="welcome-card" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
      <h2 id="welcomeTitle">Welcome to the Hub</h2>
      <p id="welcomeText"></p>
      <button class="btn-primary" id="welcomeGo" type="button">Start reading</button>
    </div>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div id="siteFooter"></div>

  <script src="../js/api.js"></script>
  <script src="../js/sound.js"></script>
  <script src="../js/panel.js"></script>
  <script src="../js/site.js"></script>
  <script src="../js/signup.js"></script>
  <script src="../js/theme.js"></script>
</body>
</html>
